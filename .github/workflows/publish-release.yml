name: Publish release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # A published package has no web sources; it ships this build in
      # web/dist for `--features web`. The crates.io job packages it rather
      # than running npm itself.
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
      - name: Test
        run: cargo test --locked --features web
      - name: Write manifest
        run: |
          cargo build --release --locked
          target/release/bbs version --manifest > bbs-release.json
          python3 -c 'import json, os, sys; m = json.load(open("bbs-release.json")); sys.exit(m["revision"] != os.environ["GITHUB_SHA"])'
          cat bbs-release.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 -c 'import json; print(json.load(open("bbs-release.json"))["tag"])')
          leftover="if an earlier run failed, delete its leftover $tag tag or draft release; otherwise bump the package version to publish $GITHUB_SHA."
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qxF "$tag" <<< "$releases"; then
            echo "::error::A $tag release or draft already exists; $leftover"
            exit 1
          fi
          # Creating the ref fails if the tag exists, so the release can only
          # land on GITHUB_SHA.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null; then
            echo "::error::Could not create tag $tag; $leftover"
            exit 1
          fi
          cat > notes.md <<NOTES
          Source revision \`$GITHUB_SHA\`. Install this release's client with:

          \`\`\`sh
          cargo install --locked --git https://github.com/wbbradley/bbs --rev $GITHUB_SHA --bin bbs
          \`\`\`

          Over a client installed before the package was renamed \`bbs-cli\`, run \`cargo uninstall bbs\` once first.

          \`bbs-release.json\` lists its protocol, schema, config format and minimum Rust version.
          NOTES
          gh release create "$tag" bbs-release.json --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "bbs $tag" --notes-file notes.md
          echo "Published [$tag]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag) at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
  # crates.io trusted publishing: a short-lived token from this workflow's OIDC
  # identity. A separate job, so no build script ever runs where the token can
  # be minted (`--no-verify`; the publish job already tested this commit). If
  # it fails, run `cargo publish --locked` from GITHUB_SHA by hand.
  crates-io:
    needs: publish
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # The web UI built and tested by the publish job; cargo packages it from
      # web/dist although git ignores it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
