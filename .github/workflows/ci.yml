name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The web feature builds the page with npm; msrv tests the default build.
      - name: Test
        run: cargo test --locked --features web
      - name: Build container
        run: docker build --build-arg BBS_BUILD_REVISION="$GITHUB_SHA" --build-arg BBS_BUILD_DIRTY=false -t bbs:test .
      - name: Test restricted container
        run: python3 scripts/test_container.py bbs:test --bbs target/debug/bbs
      - name: Check container build identity
        run: |
          docker run --rm --entrypoint bbs bbs:test version --json > identity.json
          python3 -c 'import json, os, sys; r = json.load(open("identity.json")); sys.exit(r["revision"] != os.environ["GITHUB_SHA"] or r["provenance"] != "clean")'
  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test minimum supported Rust version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" test --locked
