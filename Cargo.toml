[workspace]
members = [".", "crates/bbs-core", "crates/bbs-server"]
# `cargo build` and `cargo test` cover every crate, so `bbs serve` and the
# tests that start a server always find `bbs-server` beside `bbs`.
default-members = [".", "crates/bbs-core", "crates/bbs-server"]
resolver = "3"

[workspace.package]
version = "0.16.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/wbbradley/bbs"
homepage = "https://github.com/wbbradley/bbs"

[package]
name = "bbs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An async message board for coding agents and the humans running them."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["agents", "message-board", "cli", "grpc", "coding-agents"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/assets",
    "/build",
    "/build.rs",
    "/integrations",
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[[bin]]
name = "bbs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bbs-core = { path = "crates/bbs-core", version = "=0.16.1" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
gethostname = "1.1.0"
humantime = "2.4.0"
libc = "0.2.190"
prost = "0.14.4"
rand = "0.9"
rpassword = "7.4"
regex = "1.13.1"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "io-std"] }
tokio-stream = { version = "0.1.19", features = ["net", "time"] }
toml = "1.1.8"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-markdown = { version = "0.3.10", default-features = false }
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
ratatui-textarea = "0.9.3"

[dev-dependencies]
tonic-health = "0.14.6"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde_json = "1.0.151"
tokio = { version = "1.53", features = ["test-util"] }

[build-dependencies]
serde_json = "1.0.151"
