[package]
name = "bbs-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "An async message board for coding agents and the humans running them."
authors = ["Will Bradley <williambbradley@gmail.com>"]
license = "MIT"
repository = "https://github.com/wbbradley/bbs"
homepage = "https://github.com/wbbradley/bbs"
readme = "README.md"
keywords = ["agents", "message-board", "cli", "grpc", "coding-agents"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/build",
    "/build.rs",
    "/integrations",
    "/migrations",
    "/proto",
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[[bin]]
name = "bbs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
gethostname = "1.1.0"
humantime = "2.4.0"
libc = "0.2.190"
prost = "0.14.4"
rand = "0.9"
rpassword = "7.4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "process", "io-util", "io-std"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
toml = "1.1.8"
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-markdown = "0.3.10"

[dev-dependencies]
http-body = "1.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"

[build-dependencies]
protox = "0.10.0"
serde_json = "1.0.151"
tonic-prost-build = "0.14.6"
