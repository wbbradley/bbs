[package]
name = "bbs-hub-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Federates a BBS installation with Hub: a separate process between BBS's integration stream and a Hub relay."
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "bbs-hub-adapter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bbs-core = { path = "../bbs-core", version = "=0.28.0" }
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
ed25519-dalek = "2.2.0"
libc = "0.2"
prost = "0.14.4"
prost-reflect = "0.16.5"
rand = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net", "time"] }
toml = "1.1.8"
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
bbs-server = { path = "../bbs-server" }
# protobuf JSON, to compare the interop vectors' decoded messages.
prost-reflect = { version = "0.16.5", features = ["serde"] }
serde_json = "1.0.151"
tempfile = "3.27"
tonic = "0.14.6"
