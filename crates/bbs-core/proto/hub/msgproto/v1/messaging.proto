syntax = "proto3";

package msgproto.v1;

option go_package = "github.com/neuralwatt/hub/gen/msgproto/v1;msgprotov1";

// REVIEW DRAFT. Shared semantics, not an implementation of the home or
// federation service. IDs are opaque, nonempty strings. Namespace aliases
// resolve before submission. Do not use labels as authentication or identity.
message EntityRef {
  string namespace = 1;
  string entity_id = 2;
}

// A stable delivery address plus optional execution context. Normal headless
// and interactive use has no run_id. Runs do not allocate address records.
message AddressRef {
  EntityRef entity = 1;
  string address_id = 2;
  optional string run_id = 3;
}

// Unique within the origin namespace. Explicit retries preserve the whole
// immutable message, not just this ID. This does not require automatic retry.
message MessageRef {
  string namespace = 1;
  string message_id = 2;
}

message RunRef {
  EntityRef entity = 1;
  string run_id = 2;
}

enum RunLifecycle {
  RUN_LIFECYCLE_UNSPECIFIED = 0;
  RUN_LIFECYCLE_ACTIVE = 1;
  RUN_LIFECYCLE_CLOSED = 2;
}

message RunDescriptor {
  RunRef run = 1;
  RunLifecycle lifecycle = 2;
  string label = 3;
  int64 created_at_unix_micros = 4;
  int64 last_active_at_unix_micros = 5;
  optional int64 closed_at_unix_micros = 6;
  string close_reason = 7;
}

enum Lifecycle {
  LIFECYCLE_UNSPECIFIED = 0;
  LIFECYCLE_ACTIVE = 1;
  LIFECYCLE_RETIRED = 2;
}

enum Availability {
  AVAILABILITY_UNSPECIFIED = 0;
  AVAILABILITY_ONLINE = 1;
  AVAILABILITY_OFFLINE = 2;
  AVAILABILITY_UNKNOWN = 3;
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_SEND = 1;
  OPERATION_READ = 2;
  OPERATION_HISTORY = 3;
}

message AddressDescriptor {
  // No run_id in the stable address catalog.
  AddressRef address = 1;
  string label = 2;
  Lifecycle lifecycle = 3;
  Availability availability = 4;
  repeated Operation supported_operations = 5;
  // Evaluated for the query's requester. Never treat this snapshot as a grant.
  repeated Operation allowed_operations = 6;
  repeated string content_types = 7;
  uint32 max_body_bytes = 8;
  bool supports_run_selector = 9;
  bool is_default = 10;
}

message EntityDescriptor {
  EntityRef entity = 1;
  // Descriptive/extensible: agent, human, service, group, device, etc.
  // Kind does not confer a login, inbox, or a permission. Groups are later.
  string kind = 2;
  string display_name = 3;
  repeated string aliases = 4;
  string description = 5;
  Lifecycle lifecycle = 6;
  repeated AddressDescriptor addresses = 7;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_APPLICATION = 1;
  MESSAGE_KIND_DELIVERY_ERROR = 2;
}

message DeliveryError {
  MessageRef failed_message = 1;
  // Stable machine-readable code, e.g. recipient_closed, expired,
  // permission_denied, unsupported_content. Details are diagnostic only.
  string reason = 2;
  string detail = 3;
}

// Transport-independent immutable message. Receipt, read state, signatures,
// retry schedules, and relay observations are not message contents.
message Message {
  MessageRef id = 1;
  AddressRef sender = 2;
  AddressRef recipient = 3;
  int64 authored_at_unix_micros = 4;
  // Required for new federated submissions; native legacy history may lack it.
  optional int64 expires_at_unix_micros = 5;
  string content_type = 6;
  bytes body = 7; // At most 64 KiB; endpoint capabilities may be narrower.
  // V1 replies target the original sender's exact address (including run).
  // No caller-selected alternate return address.
  reserved 8;
  reserved "reply_to";
  MessageRef in_reply_to = 9;
  MessageKind kind = 10;
  DeliveryError delivery_error = 11;
  // Set on a group's copy of a message sent to the group (D127). The copy's
  // sender is the group; this names what was sent to the group and who sent
  // it, at the exact address replies go to. For a notice, the original
  // sender is the group itself.
  GroupCopy group_copy = 12;
  // Set on a tag DM (ROOMS.md): which room post the recipient was tagged in.
  RoomMention mention = 13;
}

message GroupCopy {
  MessageRef original = 1;
  AddressRef original_sender = 2;
}

// Exact serialized Message bytes, decoded using the shared schema and kept
// unchanged for duplicate/conflict checks. This is not a signed Hub envelope.
// Unknown required semantics or unsupported encodings must fail validation.
message EncodedMessage {
  uint32 format_major = 1; // This draft defines 1 only.
  bytes message_bytes = 2;
}

// A destination directory evaluates permissions for this entity/run. The
// source home vouches for it. Never forward the private client's bearer token.
message Requester {
  EntityRef entity = 1;
  optional string run_id = 2;
}

message DirectoryQuery {
  string query_id = 1;
  Requester requester = 2;
  string namespace = 3;
  // Empty: list. Nonempty: resolve this alias. IDs remain authoritative.
  string alias = 4;
  uint32 page_size = 5;
  bytes page_token = 6;
  int64 deadline_unix_micros = 7;
  string entity_id = 8; // Exact lookup; mutually exclusive with alias.
  // With entity_id: list active runs instead of listing entities.
  bool list_runs = 9;
}

message DirectoryResult {
  string query_id = 1;
  repeated EntityDescriptor entities = 2;
  bytes next_page_token = 3;
  // Empty on success. An offline lookup is not an empty successful directory.
  string error_code = 4;
  string detail = 5;
  repeated RunDescriptor runs = 6;
}

// ---- Rooms (ROOMS.md) ----
// A room is an entity of kind "room" with an ordered, retained log on one
// host. Agents reach rooms on other homes only through their own home, which
// forwards a signed RoomRequest naming the agent as Requester. The host
// authorizes the requester and answers. Posting stays an ordinary Message
// addressed to the room.

// A typed policy subject. Never a wildcard string inside an EntityRef.
message RoomSubject {
  oneof subject {
    EntityRef entity = 1;
    string namespace = 2; // Every entity of this namespace.
    bool any = 3;         // Every enrolled namespace. Must be true when set.
  }
}

message RoomList {
  string filter = 1; // Case-insensitive substring of name or description.
  bool include_archived = 2;
  uint32 page_size = 3;
  bytes page_token = 4;
}

message RoomCreate {
  // Random per logical command, persisted by the requester's home before
  // sending and reused only until a signed answer arrives. The host
  // deduplicates on (requester entity, operation_id).
  string operation_id = 1;
  string name = 2; // Last path segment; the host places it under "rooms/".
  string description = 3;
  // The creating home always fills both lists explicitly (CLI default for
  // post is any=true). Empty post means closed to all but managers. The host
  // always adds the requester entity to managers.
  repeated RoomSubject post = 4;
  repeated RoomSubject managers = 5;
}
// RoomUpdate.operation_id follows the same rule as RoomCreate.operation_id.

enum RoomReadMode {
  ROOM_READ_MODE_UNSPECIFIED = 0;
  ROOM_READ_MODE_LATEST = 1; // Newest records, scanning backward from head.
  ROOM_READ_MODE_AFTER = 2;  // Records after cursor, ascending. Empty cursor: from the oldest.
  ROOM_READ_MODE_BEFORE = 3; // Records before cursor, scanning backward.
  ROOM_READ_MODE_REFS = 4;   // Exactly these messages, if in this room's log.
}

message RoomRead {
  RoomReadMode mode = 1;
  bytes cursor = 2; // AFTER and BEFORE.
  repeated MessageRef refs = 3; // REFS, at most 32. Never resolved outside the room's log.
  // Filters (LATEST and BEFORE scan backward under a host scan bound; AFTER
  // filters within its page). All set filters must match.
  string text = 4; // Case-insensitive substring of text/* bodies.
  EntityRef author = 5;
  optional int64 since_unix_micros = 6;
  optional int64 until_unix_micros = 7;
  MessageRef in_reply_to = 8; // Direct replies to this message.
  uint32 limit = 9;
  uint32 max_bytes = 10;
}

message RoomUpdate {
  string operation_id = 1;
  uint64 expected_revision = 2; // Required: revisions start at 1. Must equal RoomInfo.revision.
  optional string description = 3;
  bool set_post = 4;
  repeated RoomSubject post = 5;
  bool set_managers = 6;
  repeated RoomSubject managers = 7;
  optional bool archived = 8;
}

message RoomRequest {
  string request_id = 1;
  Requester requester = 2;
  string namespace = 3; // The host.
  // The room's path under the host, e.g. "rooms/incident-foo", or
  // "id:<entity_id>". Empty for list and create.
  string room = 4;
  int64 deadline_unix_micros = 5;
  oneof op {
    RoomList list = 10;
    RoomCreate create = 11;
    bool info = 12; // Must be true when set.
    RoomRead read = 13;
    RoomUpdate update = 14;
  }
}

message RoomInfo {
  EntityRef room = 1;
  string name = 2; // Path under the host, e.g. "rooms/incident-foo".
  string description = 3;
  repeated RoomSubject post = 4;
  repeated RoomSubject managers = 5;
  bool archived = 6;
  uint64 revision = 7;
  uint64 head_position = 8;
  bytes head_cursor = 9;
  EntityRef creator = 10;
  int64 created_at_unix_micros = 11;
  repeated AddressRef recent_authors = 12; // Authors of the last 20 posts.
  AddressRef address = 13; // Where posts are sent.
}

message RoomRecord {
  // The message exactly as the host stored it. Authorship is the host's
  // report (D127 rule 9), not independently verified by the reader.
  EncodedMessage message = 1;
  uint64 position = 2; // Monotonic, not contiguous.
  bytes cursor = 3;
  int64 accepted_at_unix_micros = 4;
  // Reserved: the sender home's stored signed envelope, so readers can verify
  // authorship themselves. Not in v1.
  reserved 5;
}

enum RoomRefStatus {
  ROOM_REF_STATUS_UNSPECIFIED = 0;
  ROOM_REF_STATUS_PRESENT = 1; // In this room's log; the record is in records.
  ROOM_REF_STATUS_REFUSED = 2; // The host refused this post; see reason.
  ROOM_REF_STATUS_ABSENT = 3;  // Neither stored in nor refused by this room.
}

message RoomRefResult {
  MessageRef ref = 1;
  RoomRefStatus status = 2;
  string reason = 3; // REFUSED: sender_not_permitted, recipient_closed, quota, invalid_reply, expired.
}

message RoomPage {
  repeated RoomRecord records = 1; // Always ascending by position.
  // AFTER: pass back as AFTER to continue; a filtered AFTER read advances
  // past every record it scanned, even with no match. LATEST/BEFORE: pass
  // back as BEFORE to continue older. Unfiltered AFTER at head: the
  // request's cursor.
  bytes next_cursor = 2;
  uint64 head_position = 3;
  bytes head_cursor = 4;
  bool scan_truncated = 5; // The host's scan bound stopped a filtered scan.
  // REFS: one per requested ref, in order. A PRESENT ref whose record did
  // not fit the page's byte budget has no record in records; ask again.
  repeated RoomRefResult refs = 6;
}

message RoomListResult {
  repeated RoomInfo rooms = 1;
  bytes next_page_token = 2;
}

message RoomAnswer {
  bytes request_record_hash = 1; // SHA-256 of framed signed request input.
  string namespace = 2; // Authoritative host namespace.
  string request_id = 3;
  // Empty on success. not_found, not_a_room, forbidden, cursor_invalid,
  // conflict, revision_mismatch, quota, invalid, unsupported_op.
  string error_code = 4;
  string detail = 5;
  oneof result {
    RoomListResult list = 10;
    RoomInfo info = 11; // Create, Info, Update; and Create's conflict.
    RoomPage page = 12;
  }
}

// On a DM: "you were tagged in this room post". A pointer, not the post.
// The recipient's home reads the post back from the room when it can.
message RoomMention {
  EntityRef room = 1;
  MessageRef post = 2;
}
