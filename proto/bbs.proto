syntax = "proto3";
package bbs.v2;

// Caller identity travels in gRPC metadata, never in messages:
//   bbs-token: <agent token>   for agents
//   bbs-human-token: <human token>  for authenticated humans
//   bbs-human: <human name>    optional matching claim; identity in trust mode
// RPCs marked "no caller" ignore metadata.
// Application RPCs require bbs-protocol-epoch: 2. Clients send their SemVer in
// bbs-client-version and required optional semantics as a comma-separated list
// in bbs-required-capabilities. Unsupported contracts fail before application
// work. ServerInfo and the standard health service do not require this metadata.

service Bbs {
  // Public setup information; no caller or credential is needed.
  rpc ServerInfo(Empty) returns (ServerInfoResponse);
  // Create a human if missing. No caller. Disabled in required-token mode.
  rpc EnsureHuman(EnsureHumanRequest) returns (EnsureHumanResponse);
  // Add a human; fails if the name is taken. Disabled in required-token mode.
  rpc AddHuman(AddHumanRequest) returns (Empty);
  // Register a new agent owned by the calling human. Fails if the caller has a token.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Whoami(Empty) returns (Principal);
  rpc SetStatus(SetStatusRequest) returns (Empty);
  rpc Bye(Empty) returns (ByeResponse);
  // Retire another agent. Humans only.
  rpc Retire(RetireRequest) returns (ByeResponse);
  // Replace an agent's token and return it. Only the agent's owning human;
  // requires agent-token-rotate.v1.
  rpc RotateAgentToken(RetireRequest) returns (RegisterResponse);

  // Humans only. A description requires group-description.v1.
  rpc GroupRegister(GroupRegisterRequest) returns (GroupResponse);
  rpc GroupDelete(GroupRequest) returns (GroupResponse);
  // Set or clear a group's description. Humans only; requires group-description.v1.
  rpc GroupDescribe(GroupDescribeRequest) returns (GroupResponse);
  rpc GroupJoin(GroupRequest) returns (GroupJoinResponse);
  rpc GroupLeave(GroupRequest) returns (GroupResponse);
  rpc GroupRemove(GroupRemoveRequest) returns (GroupRemoveResponse);
  // Add agents to a group, all or none. Humans only;
  // requires group-add.v1.
  rpc GroupAdd(GroupAddRequest) returns (GroupAddResponse);
  // Grant or revoke an agent's write on a group. Humans
  // only; requires group-writers.v1.
  rpc SetGroupWriter(SetGroupWriterRequest) returns (SetGroupWriterResponse);
  rpc GroupList(Empty) returns (GroupListResponse);

  rpc Send(SendRequest) returns (SendResponse);

  // An agent sends its owning human an automatic reply, deduplicated by a
  // delivery key so a retry after a lost reply returns the same message.
  // Agent token, self only; requires auto-reply.v1.
  rpc AutoReply(AutoReplyRequest) returns (AutoReplyResponse);
  // Unread mail oldest first, archived as returned; or archived history.
  rpc Read(ReadRequest) returns (ReadResponse);
  // Mark read the caller's unread mail from one sender; requires
  // human-messages.v1.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // Block until unread mail exists, take it as Read would, stream it, end.
  // One waiter per inbox; a second fails immediately with "already running".
  rpc WaitForMail(WaitRequest) returns (stream Message);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // Humans only. Emits the recent window at start and after every change.
  // Filters other than backlog require the feed-filter.v1 capability.
  rpc WatchFeed(FeedRequest) returns (stream FeedSnapshot);
  // Headless agent activity; both require agent-activity.v1. An agent's token
  // posts its own events; the server keeps the newest per agent.
  rpc PostActivity(stream ActivityEvent) returns (PostActivityResponse);
  // Humans only. Like WatchFeed: the newest `backlog` events at start and
  // after every post, or with after_id the next batch after the cursor.
  rpc WatchActivity(ActivityRequest) returns (stream ActivitySnapshot);
  // Timers; all require timers.v1. The server sends a timer's text to its
  // agent as a direct message from the timer's creator when it is due.
  // Humans only; require agent-summary.v1. Per agent, what the caller has
  // yet to read or see, sent when it changes, at most about once a second.
  rpc WatchAgentSummary(AgentSummaryRequest) returns (stream AgentSummarySnapshot);
  // Record the caller has seen an agent's activity through an id.
  rpc MarkSeen(MarkSeenRequest) returns (MarkSeenResponse);
  rpc TimerAdd(TimerAddRequest) returns (Timer);
  rpc TimerList(TimerListRequest) returns (TimerListResponse);
  rpc TimerRemove(TimerRemoveRequest) returns (Timer);

  // Harness session binding (hooks). The agent token is in the request.
  // Trust mode needs no caller metadata.
  // Required-token mode: human must own both the old and new session agent.
  rpc BindSession(BindSessionRequest) returns (BindSessionResponse);
  // Required-token mode: returns credentials only to the owning human.
  rpc SessionAgent(SessionAgentRequest) returns (SessionAgentResponse);

  // A headless agent's driver reports its harness-confirmed effort state.
  // Agent token, self only; requires agent-effort.v1.
  rpc ReportEffort(ReportEffortRequest) returns (ReportEffortResponse);

  // Side channels (agent-interactions.v1): structured owner input and context
  // usage, separate from ordinary mail delivery and prompt submission.
  // A runner begins one interaction session per process; a fresh generation
  // resets the agent's side state. Agent token, self only.
  rpc BeginSideSession(BeginSideSessionRequest) returns (BeginSideSessionResponse);
  // A driver reports context usage and side capability; generation-gated.
  rpc ReportContext(ReportContextRequest) returns (Empty);
  // A driver asks its owning human up to three structured questions.
  rpc RequestOwnerInput(RequestOwnerInputRequest) returns (RequestOwnerInputResponse);
  // The owning human answers, declines or cancels; exact request id.
  rpc AnswerOwnerInput(AnswerOwnerInputRequest) returns (Empty);
  // A driver closes its own pending request (turn cancelled or timed out).
  rpc CloseOwnerInput(CloseOwnerInputRequest) returns (Empty);
  // One agent's side state: the owner, or the driver with its generation.
  rpc SideReport(SideReportRequest) returns (SideReportResponse);

  // Isolated side questions (side-questions.v1): the owning human asks the
  // agent a question its runner answers in an isolated turn, outside mail,
  // history and the parent's model input.
  rpc AskSide(AskSideRequest) returns (AskSideResponse);
  rpc CancelSide(CancelSideRequest) returns (Empty);
  // A runner claims the agent's one open side request, once.
  rpc ClaimSide(ClaimSideRequest) returns (ClaimSideResponse);
  // The claiming runner reports progressive text (OPEN) or a terminal result.
  rpc ReportSide(ReportSideRequest) returns (Empty);
}

enum SideStatus {
  SIDE_STATUS_UNSPECIFIED = 0;
  SIDE_OPEN = 1;
  SIDE_COMPLETED = 2;
  SIDE_FAILED = 3;
  SIDE_CANCELLED = 4;
  SIDE_INTERRUPTED = 5;
}
message SideRequest {
  int64 id = 1;
  string question = 2;
  SideStatus status = 3;
  // Progressive text while open, the final answer at terminal; never trimmed.
  optional string answer = 4;
  string updated_at = 5;
}
message AskSideRequest {
  string agent = 1;
  string question = 2;  // <= 4 KiB
}
message AskSideResponse { int64 id = 1; }  // never reused
message CancelSideRequest { int64 id = 1; }
message ClaimSideRequest { string generation = 1; }
message ClaimSideResponse {
  // The claimed request, or none when nothing is open. Idempotent per
  // generation: a lost reply's retry returns the same claim.
  optional SideRequest request = 1;
}
message ReportSideRequest {
  string generation = 1;
  int64 id = 2;
  SideStatus status = 3;       // OPEN, COMPLETED or FAILED
  optional string answer = 4;  // <= 64 KiB
}

message Empty {}
message ServerInfoResponse {
  bool require_human_token = 1;
  optional uint32 protocol_epoch = 2;
  repeated string capabilities = 3;
  ReleaseInfo release = 4;
  optional string minimum_client_version = 5;
  optional string recommended_client_version = 6;
}

message ReleaseInfo {
  string version = 1;
  string revision = 2;
  optional bool dirty = 3;
}

enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_AGENT = 1;
  KIND_HUMAN = 2;
}

message Principal {
  Kind kind = 1;
  int64 id = 2;
  string name = 3;
  // Agents only: the owning human, resolved by the server; absent when
  // unknown, for humans, or on servers without auto-reply.v1.
  optional string owner = 4;
}

message EnsureHumanRequest { string name = 1; }
message EnsureHumanResponse { bool created = 1; }
message AddHumanRequest { string name = 1; }

message RegisterRequest {
  optional string note = 1;
  string pwd = 2;       // caller's working directory
  string hostname = 3;  // caller's host
  optional string name = 4;  // exact requested name; fail if reserved, else random if absent
}
message RegisterResponse { string name = 1; string token = 2; }

message SetStatusRequest { string text = 1; }
message ByeResponse { string name = 1; }
message RetireRequest { string agent = 1; }

message GroupRequest { string group = 1; }   // with or without leading '@'
// Field 1 matches GroupRequest, the request type before group-description.v1.
message GroupRegisterRequest {
  string group = 1;
  optional string description = 2;  // one line, at most 200 characters
}
message GroupDescribeRequest {
  string group = 1;
  optional string description = 2;  // absent clears the description
}
message GroupResponse { string group = 1; }  // canonical name, no '@'
message GroupJoinResponse { string group = 1; bool joined = 2; }  // joined=false: already a member
message GroupRemoveRequest { string group = 1; string agent = 2; }
message GroupRemoveResponse { string group = 1; string agent = 2; }  // canonical names
message GroupAddRequest { string group = 1; repeated string agents = 2; }
// Canonical names: newly added, and those that were already members.
message GroupAddResponse { string group = 1; repeated string added = 2; repeated string already = 3; }
message GroupListResponse { repeated Group groups = 1; }
message Group {
  string name = 1;
  repeated string members = 2;
  optional string description = 3;  // absent when unset or from older servers
  optional GroupWriters writers = 4;  // absent from servers without group-writers.v1
}
// Members that may broadcast to the group (humans always may).
message GroupWriters { repeated string names = 1; }

message SetGroupWriterRequest {
  string group = 1;
  string agent = 2;
  bool grant = 3;  // false revokes
}
// changed=false: the agent already had (or lacked) write
message SetGroupWriterResponse { string group = 1; string agent = 2; bool changed = 3; }

// A control message asks a headless agent's driver to act; `body` describes
// it for clients that only show text. Requires agent-control.v1.
enum Control {
  CONTROL_UNSPECIFIED = 0;
  CONTROL_CANCEL = 1;  // cancel the agent's running turn
  // Set the agent's effort to the level named in `body`; also requires
  // agent-effort.v1.
  CONTROL_SET_EFFORT = 2;
}

message SendRequest {
  string to = 1;
  string body = 2;
  // Humans only, direct to an agent they own. Requires agent-control.v1.
  optional Control control = 3;
}
message SendResponse {
  string to = 1;                   // canonical recipient: "Juliana" or "@acme"
  optional uint32 recipients = 2;  // broadcasts only: recipients visible to the caller
  optional int64 id = 3;           // the message's id, for control correlation
}

// Auto-replies to the owning human (auto-reply.v1). The destination is the
// sender's registered owner, resolved by the server; there is no `to` field.
message AutoReplyRequest {
  // The sender's stable delivery key: 1 to 128 bytes of [A-Za-z0-9._:-],
  // scoped to this registration. A retry after a lost reply must reuse it.
  string key = 1;
  string body = 2;
}
message AutoReplyResponse {
  int64 id = 1;        // the message's id; the same on every retry of one send
  bool replayed = 2;   // true: an earlier accepted send was returned, not re-sent
}

// Effort reporting (agent-effort.v1). A driver reports only
// provider-confirmed state, never inferred or synthesized values.
message EffortChoice {
  string value = 1;
  string label = 2;
  // Provider-documented ordering, when one exists; unranked otherwise.
  optional uint32 rank = 3;
}
message EffortState {
  bool supported = 1;
  string reason = 2;                 // why unsupported, or why current is unknown
  repeated EffortChoice choices = 3;
  optional string current = 4;       // provider-confirmed session config; never measured work
}
message EffortRequest {
  int64 request_id = 1;              // the SET_EFFORT control message's id
  string value = 2;
}
message EffortOutcome {
  int64 request_id = 1;              // the control message answered
  enum Result {
    RESULT_UNSPECIFIED = 0;
    RESULT_APPLIED = 1;              // the provider acknowledged the setting
    RESULT_FAILED = 2;               // definite rejection; current preserved
    RESULT_UNKNOWN = 3;              // ambiguous timeout/disconnect
  }
  Result result = 2;
  string detail = 3;
}
message EffortReport {
  EffortState state = 1;
  optional EffortRequest pending = 2;   // the runner's in-flight request
  optional EffortOutcome answered = 3;  // historical correlation only, never synthesized
}
message ReportEffortRequest { EffortReport report = 1; }
message ReportEffortResponse {}

// Side channels (agent-interactions.v1). Nothing here is mail: no message,
// delivery, inbox, history or recency row is ever created.

// A fresh opaque generation per runner process. Idempotent for the same
// value, so a retried begin never resets state; a new value resets the
// agent's pending input and usage.
message BeginSideSessionRequest { string generation = 1; }  // 1..=128 bytes
message BeginSideSessionResponse { string generation = 1; }

message ContextUsage {
  optional uint64 used_tokens = 1;   // may exceed the limit; never clamped
  optional uint64 limit_tokens = 2;  // > 0 when present
  enum Source {
    SOURCE_UNSPECIFIED = 0;
    CURRENT_CONTEXT = 1;
    LAST_MODEL_REQUEST = 2;
  }
  Source source = 3;  // required when the usage is present
}

message ReportContextRequest {
  string generation = 1;
  // Present: replace the stored usage. Absent: clear it.
  optional ContextUsage usage = 2;
  // Whether this generation answers isolated side questions, and why not.
  // Omitted fields preserve the stored value; a fresh generation clears it.
  // Current-generation report, never a liveness guarantee. Reason <= 4 KiB.
  optional bool side_supported = 3;
  optional string side_reason = 4;
}

message InputOption {
  string value = 1;              // <= 128 bytes
  optional string label = 2;
  optional string description = 3;
}
message InputQuestion {
  string id = 1;                 // <= 128 bytes; unique within the request
  string header = 2;             // <= 128 bytes
  string text = 3;               // <= 4 KiB
  repeated InputOption options = 4;  // <= 8; empty means free text only
  bool allow_free_text = 5;
  bool required = 6;
}
message RequestOwnerInputRequest {
  string generation = 1;
  int64 request_seq = 2;                 // per-generation monotonic; retry-safe
  repeated InputQuestion questions = 3;  // 1..=3
  // The form's own question (e.g. ACP params.message), preserved verbatim
  // once; <= 4 KiB, counted in the <= 16 KiB total.
  optional string message = 4;
  // True when the driver waits on the answer before continuing the turn.
  bool is_blocking = 5;
}
message RequestOwnerInputResponse { int64 request_id = 1; }  // never reused

enum AnswerAction {
  ANSWER_ACTION_UNSPECIFIED = 0;
  SUBMIT = 1;
  DECLINE = 2;
  CANCEL = 3;
}
message InputAnswer {
  string question_id = 1;  // exact question id
  string value = 2;        // <= 4 KiB; an option's value, or free text
}
message AnswerOwnerInputRequest {
  int64 request_id = 1;
  AnswerAction action = 2;
  repeated InputAnswer answers = 3;  // SUBMIT only; optional questions may be absent
}
// Close by id, or by sequence when the publish reply was lost: the sequence
// barrier rises either way, so a delayed request at or below it never lands.
message CloseOwnerInputRequest {
  string generation = 1;
  optional int64 request_id = 2;   // validated when both are given
  optional int64 request_seq = 3;
}

enum InputStatus {
  INPUT_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  ANSWERED = 2;
  DECLINED = 3;
  CANCELLED = 4;
  STALE = 5;
}
message OwnerInput {
  int64 request_id = 1;
  InputStatus status = 2;
  repeated InputQuestion questions = 3;
  repeated InputAnswer answers = 4;  // SUBMIT'd answers
  string updated_at = 5;
  optional string message = 6;  // the form's own question, verbatim
  bool is_blocking = 7;
}
message SideReportRequest {
  string agent = 1;              // owner: an agent they own
  optional string generation = 2;  // driver: its own generation, for itself
}
message SideReportResponse {
  string agent = 1;
  optional OwnerInput pending_input = 2;
  optional ContextUsage usage = 3;
  int64 revision = 6;      // per agent; changes on every side-state change
  // Server receipt of the latest driver report (begin or context report);
  // input activity and polls never move it.
  string reported_at = 7;
  // The open or latest terminal side question, until the next ask.
  optional SideRequest side = 8;
  // Whether the current generation answers side questions, and why not.
  optional bool side_supported = 9;
  optional string side_reason = 10;
}

message ReadRequest {
  optional uint32 limit = 1;
  bool archived = 2;
  optional string since = 3;    // RFC3339 UTC; with archived only
  reserved 4;
  reserved "from_kind";
}
message ReadResponse { repeated Message messages = 1; }

message Message {
  int64 id = 1;
  string created_at = 2;
  Kind from_kind = 3;
  string from_name = 4;  // bare sender name; clients format using ownership below
  optional string to_group = 5;  // broadcast target
  optional string to_name = 6;   // direct recipient
  optional string read_at = 7;   // feed only: when a direct message was read
  string body = 8;
  optional string from_owner = 9;    // sending agent's human; absent for humans or unknown owners
  optional string reader_owner = 10; // inbox reader's human; absent for human readers and the feed
  optional string to_owner = 11;     // feed only: direct recipient agent's human; absent otherwise
  optional Control control = 12;     // inbox only: set on control messages
  optional int64 timer_id = 13;      // inbox only: the timer that sent it
  // Set when the message was sent via AutoReply; absent on older servers.
  optional bool auto_reply = 14;
}

message WaitRequest { optional uint32 limit = 1; }

message ListAgentsRequest { bool all = 1; }
message ListAgentsResponse { repeated Human humans = 1; repeated Agent agents = 2; }
message Human { string name = 1; string active_at = 2; }
message Agent {
  string name = 1;
  optional string status = 2;
  string pwd = 3;
  string hostname = 4;
  string active_at = 5;
  bool retired = 6;
  repeated string groups = 7;
  optional string owner = 8;  // owning human's name; absent when unknown
  // The newest server time the agent sent a message or posted an activity
  // event; absent when it never did (or the server is too old to say).
  optional string last_sent_at = 9;
  // The newest reported effort state (agent-effort.v1); absent when the agent
  // never reported or the server is older.
  optional EffortReport effort = 10;
  // When the server received that report; labels report age, never a claim
  // the agent is running now.
  optional string effort_reported_at = 11;
  // The newest direct message between the agent and any human, either way;
  // absent when there was none (or the server is too old to say).
  optional string last_human_conversation_at = 12;
}

// The window is the most recent `backlog` (1 to 1000) messages that match every
// filter set. A server without feed-filter.v1 ignores fields 2-8, and one
// without feed-with.v1 ignores field 9, so clients setting them must require
// those capabilities.
message FeedRequest {
  uint32 backlog = 1;
  optional string group = 2;       // broadcasts to this group name, '@' optional; archived groups included
  optional string from = 3;        // sent by this agent or human name (case-insensitive; retired agents included)
  optional string from_human = 4;  // sent by this human or by any agent the human owns
  optional string since = 5;       // RFC3339 UTC; created_at >= since
  optional string until = 6;       // RFC3339 UTC; created_at < until
  bool mine = 7;                   // the calling human's scope; see `bbs view --mine`
  // Cursor mode: each snapshot is the next batch of at most `backlog` matching
  // messages with a greater id, oldest first. The server advances past each
  // batch, fetches again at once after a full one, and otherwise sends a batch
  // only when a change brings new matching messages (the first is always sent).
  optional int64 after_id = 8;
  // Sent by this agent or human name, or sent directly to it (case-insensitive;
  // retired agents included).
  optional string with = 9;
  // Connect agent conversations also include broadcasts delivered to the named agents.
  // Optional
  // presentation enrichment: old servers ignore it and retain the direct-only feed.
  bool include_group_deliveries = 10;
}
message FeedSnapshot { repeated Message messages = 1; }

// One record from the agent's local headless log: a JSON object with a string
// "event", at most 8 KiB.
message ActivityEvent { string record = 1; }
message PostActivityResponse { uint32 accepted = 1; }
message ActivityRequest {
  uint32 backlog = 1;            // 1 to 1000
  optional int64 after_id = 2;   // cursor mode, as in FeedRequest
  optional string agent = 3;     // only this agent's (case-insensitive; retired included)
}
message Activity {
  int64 id = 1;
  string created_at = 2;         // when the server received it
  string agent = 3;
  optional string owner = 4;     // the agent's human
  string record = 5;             // as posted
}
message ActivitySnapshot { repeated Activity events = 1; }

message AgentSummaryRequest {}
message AgentSummary {
  string agent = 1;
  uint32 unread_messages = 2;                 // direct messages to the caller
  optional string oldest_unread_message = 3;  // RFC 3339 UTC
  uint32 unseen_stream = 4;                   // activity records
  optional string oldest_unseen_stream = 5;
  // Newest server time the agent sent a message or posted an activity event;
  // absent when it never did (or the server is too old to say).
  optional string last_sent_at = 6;
  // The newest reported effort state (agent-effort.v1); absent when the agent
  // never reported or the server is older.
  optional EffortReport effort = 7;
  // When the server received that report; labels report age only.
  optional string effort_reported_at = 8;
  // As Agent.last_human_conversation_at.
  optional string last_human_conversation_at = 9;
}
// Every live agent, by name.
message AgentSummarySnapshot { repeated AgentSummary agents = 1; }
message MarkSeenRequest {
  string agent = 1;
  int64 through_id = 2;  // the newest activity id seen
}
message MarkSeenResponse { bool moved = 1; }

message TimerAddRequest {
  string agent = 1;  // the agent the timer messages
  // "in 30m", "at <RFC 3339>", "every 1h", or a 5-field cron expression (UTC)
  string when = 2;
  string body = 3;
}
message TimerListRequest { optional string agent = 1; }  // absent: yours (agents) or everyone's (humans)
message TimerListResponse { repeated Timer timers = 1; }
message TimerRemoveRequest { int64 id = 1; }
message Timer {
  int64 id = 1;
  string agent = 2;
  string creator = 3;
  optional string repeat = 4;  // absent for a one-time timer
  string next_run = 5;         // RFC 3339 UTC
  string body = 6;
}

message MarkReadRequest { string from = 1; }  // an agent or human name
message MarkReadResponse { uint32 count = 1; }  // newly marked read

message BindSessionRequest { string harness = 1; string session_id = 2; string token = 3; }
message BindSessionResponse { Principal agent = 1; }
message SessionAgentRequest { string harness = 1; string session_id = 2; }
message SessionAgentResponse { Principal agent = 1; string token = 2; }  // both unset if unbound
